<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Browse and compare NobodyWho website prototypes.">
<title>NobodyWho prototype explorer</title>
<style>
@font-face{font-family:Satoshi;src:url('src/assets/fonts/Satoshi-Regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:Satoshi;src:url('src/assets/fonts/Satoshi-Medium.woff2') format('woff2');font-weight:500;font-display:swap}@font-face{font-family:Satoshi;src:url('src/assets/fonts/Satoshi-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--ink:#000;--secondary:rgb(0 0 0 / 64%);--tertiary:rgb(0 0 0 / 56%);--line:rgb(0 0 0 / 10%);--strong:rgb(0 0 0 / 18%);--wash:rgb(0 0 0 / 4%);--hover:rgb(0 0 0 / 6%);--brand:#4d7183;--radius:8px;color-scheme:light}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#f4f4f4;color:var(--ink);font:14px/1.5 Satoshi,system-ui,sans-serif;overflow:hidden}button,select{font:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;z-index:50;background:#fff;padding:8px 12px;outline:2px solid #000;border-radius:var(--radius)}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 20px;position:relative;z-index:10}.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}.brand strong{font-size:17px;letter-spacing:-.035em}.brand span{font-size:12px;color:var(--tertiary)}.collection-tabs,.mode-tabs,.page-tabs,.viewport-tabs{display:flex;gap:3px;background:var(--wash);padding:3px;border-radius:7px}.collection-tabs{margin-left:auto}.tab{border:0;background:transparent;color:var(--secondary);border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}.tab:hover{color:#000}.tab.active{background:#fff;color:#000;box-shadow:0 0 0 1px var(--line);font-weight:500}.workspace{height:calc(100% - 64px);display:grid;grid-template-columns:276px minmax(0,1fr)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 12px;overflow:auto}.side-meta{display:flex;justify-content:space-between;color:var(--tertiary);font-size:12px;padding:0 8px 12px}.prototype-list{display:grid;gap:3px}.prototype-row{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:3px}.prototype-button{width:100%;min-width:0;border:0;background:transparent;border-radius:6px;padding:10px;text-align:left;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;color:var(--secondary)}.prototype-button:hover{background:var(--wash);color:#000}.prototype-button.active{background:var(--hover);color:#000;box-shadow:inset 3px 0 0 var(--brand)}.prototype-button .number{color:var(--tertiary);font-size:12px;padding-top:2px}.prototype-button strong{font-size:14px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prototype-button small{display:block;color:var(--tertiary);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-vote{border:1px solid transparent;background:transparent;border-radius:6px;min-height:40px;padding:0 5px;color:var(--tertiary);font-size:12px;cursor:pointer}.mini-vote:hover{border-color:var(--strong);color:#000}.mini-vote.voted{background:#000;color:#fff}.mini-vote:disabled{cursor:wait;opacity:.48}.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}.viewer-bar{min-height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:9px 14px}.selection{min-width:0;margin-right:auto}.selection strong{display:block;font-weight:500;font-size:14px}.path{display:block;color:var(--tertiary);font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}.tool-button{border:1px solid var(--strong);background:#fff;border-radius:6px;min-height:34px;padding:0 10px;cursor:pointer;color:var(--secondary);white-space:nowrap}.tool-button:hover{background:var(--wash);color:#000}.tool-button:disabled{cursor:wait;opacity:.5}.vote-button.voted{background:#000;border-color:#000;color:#fff}.vote-button .vote-total{display:inline-block;min-width:16px;margin-left:4px}.open-link{text-decoration:none;display:inline-flex;align-items:center}.mobile-select{display:none;border:1px solid var(--strong);border-radius:6px;background:#fff;padding:7px 9px;min-width:0}.stage{flex:1;min-height:0;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start}.stage:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}.device{background:#fff;border:1px solid var(--strong);border-radius:10px;overflow:hidden;height:100%;min-height:560px;transition:width .2s ease;box-shadow:0 8px 28px rgb(0 0 0 / 5%)}.device.desktop{width:100%}.device.tablet{width:min(820px,100%)}.device.mobile{width:min(390px,100%)}.preview{width:100%;height:100%;border:0;background:#fff;display:block}.overview{flex:1;overflow:auto;padding:24px}.overview-head{max-width:1400px;margin:0 auto 20px}.overview-head h1{font-size:28px;line-height:1.15;letter-spacing:-.04em;font-weight:500;margin:0}.overview-head p{color:var(--secondary);margin:7px 0 0}.cards{max-width:1400px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);background:#fff;border-radius:10px;overflow:hidden;padding:0;text-align:left;cursor:pointer;transition:transform .15s ease,border-color .15s ease}.card:hover{transform:translateY(-2px);border-color:var(--strong)}.thumb{height:250px;overflow:hidden;background:#eee;border-bottom:1px solid var(--line);position:relative}.thumb iframe{width:400%;height:400%;border:0;transform:scale(.25);transform-origin:0 0;pointer-events:none;background:#fff}.card-copy{padding:13px 14px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}.card-copy strong{font-size:15px;font-weight:500;display:block}.card-copy span{font-size:12px;color:var(--tertiary)}.card-copy .card-votes{grid-row:1/3;grid-column:2;align-self:center;color:var(--secondary);font-size:13px}.empty{padding:40px;color:var(--secondary)}.shortcut{color:var(--tertiary);font-size:11px;margin-left:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}body[data-view="overview"] .stage,body[data-view="overview"] .viewport-tabs,body[data-view="overview"] #copyPath,body[data-view="overview"] #openPage{display:none}body[data-view="preview"] .overview{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.viewport-tabs{display:none}.path{max-width:260px}}
@media(max-width:780px){body{overflow:auto}.topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 12px;gap:8px}.brand{width:100%}.collection-tabs{margin-left:0}.workspace{height:calc(100dvh - 112px);display:block}.sidebar{display:none}.viewer-bar{flex-wrap:wrap}.mobile-select{display:block;flex:1}.selection{display:none}.mode-tabs{order:3}.stage{padding:12px}.device{min-height:620px;width:100%!important}.overview{padding:16px}.cards{grid-template-columns:1fr}.thumb{height:300px}.shortcut{display:none}}
@media(max-width:480px){.collection-tabs,.mode-tabs{flex:1}.collection-tabs .tab,.mode-tabs .tab{flex:1}.page-tabs{order:4}.viewer-bar{gap:8px}.overview-head h1{font-size:24px}.thumb{height:235px}}
@media(prefers-reduced-motion:reduce){.device,.card{transition:none}}
</style>
</head>
<body data-view="preview"><a class="skip" href="#main">Skip to explorer</a>
<header class="topbar" aria-label="Prototype explorer header"><div class="brand"><strong>NobodyWho prototypes</strong><span id="totalCount">4 options</span></div><nav class="mode-tabs" aria-label="Explorer view"><button class="tab active" data-view="preview">Preview</button><button class="tab" data-view="overview">Overview</button></nav></header>
<div class="workspace" id="main"><aside class="sidebar"><div class="side-meta"><span>Prototypes</span><span class="shortcut">↑ ↓ to browse</span></div><div class="prototype-list" id="prototypeList"></div></aside><main class="main" aria-label="Prototype explorer workspace"><div class="viewer-bar"><select class="mobile-select" id="mobileSelect" aria-label="Choose prototype"></select><div class="selection"><strong id="selectionTitle"></strong><span class="path" id="selectionPath"></span></div><nav class="viewport-tabs" aria-label="Preview size"><button class="tab active" data-viewport="desktop">Desktop</button><button class="tab" data-viewport="tablet">Tablet</button><button class="tab" data-viewport="mobile">Mobile</button></nav><button class="tool-button vote-button" id="voteButton" type="button" data-vote="" aria-pressed="false" disabled>▲ Vote <span class="vote-total" data-count>0</span></button><button class="tool-button" id="copyPath" type="button">Copy path</button><a class="tool-button open-link" id="openPage" target="_blank" rel="noopener">Open</a></div><section class="stage" aria-label="Prototype preview" tabindex="0"><div class="device desktop" id="device"><iframe class="preview" id="preview" title="Prototype preview"></iframe></div></section><section class="overview"><div class="overview-head"><h1>Prototype overview</h1><p id="overviewDescription"></p></div><div class="cards" id="cards"></div></section><span class="sr-only" id="voteMessage" aria-live="polite"></span></main></div>
<script>
const prototypes=[
{id:'sol-1',collection:'poc',number:1,title:'Terminal',subtitle:'Acid green, raw type',landing:'prototypes-sol/option-1/landing.html'},
{id:'sol-2',collection:'poc',number:2,title:'Orbit',subtitle:'Dark field, orbital lines',landing:'prototypes-sol/option-2/landing.html'},
{id:'sol-3',collection:'poc',number:3,title:'Poster',subtitle:'Oversized print energy',landing:'prototypes-sol/option-3/landing.html'},
{id:'sol-4',collection:'poc',number:4,title:'Play',subtitle:'Colorful, off-grid',landing:'prototypes-sol/option-4/landing.html'}
];
const state={selected:'sol-1',collection:'all',page:'landing',viewport:'desktop',view:'preview'};
const voteState={counts:Object.fromEntries(prototypes.map(item=>[item.id,0])),pending:new Set(),ready:false,scope:null,voted:new Set()};
const elements={list:document.querySelector('#prototypeList'),select:document.querySelector('#mobileSelect'),title:document.querySelector('#selectionTitle'),path:document.querySelector('#selectionPath'),preview:document.querySelector('#preview'),device:document.querySelector('#device'),open:document.querySelector('#openPage'),copy:document.querySelector('#copyPath'),vote:document.querySelector('#voteButton'),voteMessage:document.querySelector('#voteMessage'),cards:document.querySelector('#cards'),description:document.querySelector('#overviewDescription')};
function filtered(){return prototypes}
function current(){return prototypes.find(item=>item.id===state.selected)||filtered()[0]||prototypes[0]}
function pagePath({item}){return item.landing}
function writeHash(){const params=new URLSearchParams({prototype:state.selected,page:state.page,view:state.view,viewport:state.viewport,collection:state.collection});history.replaceState(null,'','#'+params.toString())}
function readHash(){if(!location.hash)return;const params=new URLSearchParams(location.hash.slice(1));if(prototypes.some(item=>item.id===params.get('prototype')))state.selected=params.get('prototype');if(['landing','about','pricing','docs'].includes(params.get('page')))state.page=params.get('page');if(['preview','overview'].includes(params.get('view')))state.view=params.get('view');if(['desktop','tablet','mobile'].includes(params.get('viewport')))state.viewport=params.get('viewport');}
function voterID(){const key='nobodywho-prototype-voter';try{const saved=localStorage.getItem(key);if(saved)return saved;const created=crypto.randomUUID();localStorage.setItem(key,created);return created}catch{return crypto.randomUUID()}}
function voteStorageKey(){return `nobodywho-prototype-votes:${voteState.scope}`}
function persistVotes(){if(!voteState.scope)return;try{localStorage.setItem(voteStorageKey(),JSON.stringify([...voteState.voted]))}catch{}}
function renderList(){const items=filtered();if(!items.some(item=>item.id===state.selected))state.selected=items[0]?.id||prototypes[0].id;elements.list.innerHTML=items.map(item=>`<div class="prototype-row"><button class="prototype-button ${item.id===state.selected?'active':''}" data-id="${item.id}"><span class="number">${String(item.number).padStart(2,'0')}</span><span><strong>${item.title}</strong><small>${item.collection.toUpperCase()} · ${item.subtitle}</small></span></button><button class="mini-vote" type="button" data-vote="${item.id}" aria-pressed="false"><span aria-hidden="true">▲</span> <span data-count>${voteState.counts[item.id]}</span></button></div>`).join('');elements.select.innerHTML=items.map(item=>`<option value="${item.id}" ${item.id===state.selected?'selected':''}>${item.title}</option>`).join('');elements.list.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>selectPrototype({id:button.dataset.id})));elements.list.querySelectorAll('[data-vote]').forEach(button=>button.addEventListener('click',()=>toggleVote({id:button.dataset.vote})));elements.select.onchange=()=>selectPrototype({id:elements.select.value})}
function renderPreview(){const item=current(),path=pagePath({item});elements.title.textContent=item.title;elements.path.textContent=path;elements.preview.src=path;elements.preview.title=`${item.title} ${state.page} preview`;elements.open.href=path;elements.device.className=`device ${state.viewport}`;elements.vote.dataset.vote=item.id}
function renderOverview(){const items=filtered();elements.description.textContent=`${items.length} landing-page POCs. Shared vote totals update automatically.`;elements.cards.innerHTML=items.map(item=>`<button class="card" data-id="${item.id}"><div class="thumb"><iframe src="${pagePath({item})}" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="card-copy"><strong>${item.title}</strong><span>${item.collection.toUpperCase()} · ${item.subtitle}</span><span class="card-votes" aria-label="${voteState.counts[item.id]} votes">▲ <b data-count-for="${item.id}">${voteState.counts[item.id]}</b></span></div></button>`).join('');elements.cards.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{state.view='preview';selectPrototype({id:card.dataset.id})}))}
function renderVotes(){document.querySelectorAll('[data-vote]').forEach(button=>{const id=button.dataset.vote,item=prototypes.find(prototype=>prototype.id===id),count=voteState.counts[id]??0,voted=voteState.voted.has(id);button.classList.toggle('voted',voted);button.setAttribute('aria-pressed',String(voted));button.setAttribute('aria-label',`${voted?'Remove vote from':'Upvote'} ${item?.title??'prototype'}. ${count} ${count===1?'vote':'votes'}.`);button.disabled=!voteState.ready||voteState.pending.has(id);button.querySelector('[data-count]').textContent=String(count)});document.querySelectorAll('[data-count-for]').forEach(element=>{const count=voteState.counts[element.dataset.countFor]??0;element.textContent=String(count);element.parentElement.setAttribute('aria-label',`${count} ${count===1?'vote':'votes'}`)})}
function syncTabs(){document.body.dataset.view=state.view;document.querySelectorAll('button[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));document.querySelectorAll('[data-viewport]').forEach(button=>button.classList.toggle('active',button.dataset.viewport===state.viewport))}
function render(){renderList();renderPreview();renderOverview();syncTabs();renderVotes();writeHash()}
function selectPrototype({id}){state.selected=id;state.view='preview';render()}
async function loadVotes(){try{const response=await fetch('/api/prototype-votes',{cache:'no-store'});if(!response.ok)throw new Error('Votes unavailable');const data=await response.json(),scopeChanged=voteState.scope!==data.scope;voteState.counts={...voteState.counts,...data.counts};voteState.scope=data.scope;if(scopeChanged){try{const saved=JSON.parse(localStorage.getItem(voteStorageKey())||'[]');voteState.voted=new Set(saved.filter(id=>prototypes.some(item=>item.id===id)))}catch{voteState.voted=new Set()}}voteState.ready=true;renderVotes()}catch{voteState.ready=false;elements.voteMessage.textContent='Shared voting is unavailable on this copy of the explorer.';renderVotes()}}
async function toggleVote({id}){if(!voteState.ready||voteState.pending.has(id))return;const adding=!voteState.voted.has(id),previous=voteState.counts[id]??0;voteState.pending.add(id);voteState.counts[id]=Math.max(0,previous+(adding?1:-1));adding?voteState.voted.add(id):voteState.voted.delete(id);persistVotes();renderVotes();try{const response=await fetch('/api/prototype-votes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:adding?'add':'remove',prototype:id,voterID:voterID()})});if(!response.ok)throw new Error('Vote failed');const data=await response.json(),optimistic=voteState.counts[id];voteState.counts={...voteState.counts,...data.counts};if(data.changed)voteState.counts[id]=optimistic;elements.voteMessage.textContent=adding?'Vote added.':'Vote removed.'}catch{voteState.counts[id]=previous;adding?voteState.voted.delete(id):voteState.voted.add(id);persistVotes();elements.voteMessage.textContent='The vote could not be saved. Please try again.'}finally{voteState.pending.delete(id);renderVotes()}}
document.querySelectorAll('button[data-view]').forEach(button=>button.addEventListener('click',()=>{state.view=button.dataset.view;render()}));document.querySelectorAll('[data-viewport]').forEach(button=>button.addEventListener('click',()=>{state.viewport=button.dataset.viewport;render()}));elements.vote.addEventListener('click',()=>toggleVote({id:current().id}));elements.copy.addEventListener('click',async()=>{const path=pagePath({item:current()});try{await navigator.clipboard.writeText(path)}catch{const area=document.createElement('textarea');area.value=path;document.body.append(area);area.select();document.execCommand('copy');area.remove()}elements.copy.textContent='Copied';setTimeout(()=>elements.copy.textContent='Copy path',1100)});document.addEventListener('keydown',event=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const items=filtered(),index=items.findIndex(item=>item.id===state.selected),delta=event.key==='ArrowDown'?1:-1;selectPrototype({id:items[(index+delta+items.length)%items.length].id})}});readHash();render();void loadVotes();
</script></body></html>
