<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Install the NobodyWho agent skill."><title>NobodyWho · Agent skill</title><link rel="stylesheet" href="../../prototype-pages.css"></head><body><main class="poc" data-design="poster"><div class="frame"><div class="brand">NobodyWho <span>/ skill</span></div><section class="main"><p class="prompt">Install the skill</p><div class="install"><code>npx skills add https://github.com/nobodywho-ooo/nobodywho --skill nobodywho</code><button class="copy" type="button" data-copy>Copy</button></div><div class="subgrid"><section><p class="label">Bindings</p><div class="bindings"><img class="binding" src="https://cdn.simpleicons.org/python" alt="Python"><img class="binding" src="https://cdn.simpleicons.org/react" alt="React Native"><img class="binding" src="https://cdn.simpleicons.org/expo" alt="Expo"><img class="binding" src="https://cdn.simpleicons.org/flutter" alt="Flutter"><img class="binding" src="https://cdn.simpleicons.org/swift" alt="Swift"><img class="binding" src="https://cdn.simpleicons.org/kotlin" alt="Kotlin"><img class="binding" src="https://cdn.simpleicons.org/godotengine" alt="Godot"></div></section><section><p class="label">Modalities</p><div class="modalities"><span class="modality">Text</span><span class="modality">Vision</span><span class="modality">Speech</span><span class="modality">Audio</span></div></section></div></section></div></main><script>document.querySelector('[data-copy]').addEventListener('click',async event=>{const button=event.currentTarget;try{await navigator.clipboard.writeText(button.previousElementSibling.textContent);button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1000)}catch{button.textContent='Copy manually'}})</script></body></html>
