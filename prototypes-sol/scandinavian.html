<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NobodyWho Scandinavian prototypes</title>
<style>
@font-face{font-family:Satoshi;src:url('../src/assets/fonts/Satoshi-Regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:Satoshi;src:url('../src/assets/fonts/Satoshi-Medium.woff2') format('woff2');font-weight:500;font-display:swap}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Satoshi,system-ui,sans-serif}.bar{height:56px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid rgb(0 0 0 / 12%);background:#fff}.bar strong{font-size:14px;font-weight:500;margin-right:auto}.group{display:flex;gap:4px}.group button{border:0;background:transparent;border-radius:6px;padding:7px 10px;font:500 13px Satoshi;cursor:pointer;color:rgb(0 0 0 / 64%)}.group button:hover{background:rgb(0 0 0 / 5%);color:#000}.group button.active{background:#000;color:#fff}.frame{display:block;width:100%;height:calc(100% - 56px);border:0;background:#fff}@media(max-width:680px){.bar{height:auto;min-height:56px;flex-wrap:wrap;padding:10px 12px;gap:8px}.bar strong{width:100%}.frame{height:calc(100% - 102px)}.group{flex:1}.group button{flex:1}}
</style></head>
<body><header class="bar"><strong>Scandinavian prototypes</strong><nav class="group" aria-label="Design direction"><button class="active" data-option="5">Quiet</button><button data-option="6">Editorial</button><button data-option="7">Utilitarian</button></nav><nav class="group" aria-label="Page type"><button class="active" data-page="landing">Landing</button><button data-page="docs">Docs</button></nav></header><iframe class="frame" src="option-5/landing.html" title="NobodyWho prototype preview"></iframe><script>
let option='5',page='landing';const frame=document.querySelector('.frame');function update(){frame.src=`option-${option}/${page}.html`};document.querySelectorAll('[data-option]').forEach(button=>button.addEventListener('click',()=>{option=button.dataset.option;document.querySelectorAll('[data-option]').forEach(item=>item.classList.toggle('active',item===button));update()}));document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{page=button.dataset.page;document.querySelectorAll('[data-page]').forEach(item=>item.classList.toggle('active',item===button));update()}));
</script></body></html>
